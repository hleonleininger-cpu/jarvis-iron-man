<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>JARVIS</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>JARVIS</h1>
    <span id="model" class="muted"></span>
    <button id="reset" type="button" title="Verlauf vergessen und neu beginnen">Neues Gespräch</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="ask">
    <textarea id="message" rows="1" placeholder="Nachricht an JARVIS …" autocomplete="off" required></textarea>
    <button id="send" type="submit">Senden</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
