[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS Core: lokaler KI-Assistent (FastAPI-Server + CLI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-ai-slim[openai,mcp]",
    # direkt genutzt für den Ollama-Client (ohne Proxy, mit Zeitlimit); kommen mit pydantic-ai
    "openai",
    "httpx2",
    "pydantic-settings",
    "structlog",
    "typer",
    "keyring",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[project.scripts]
jarvis = "jarvis_core.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core", "src/mcp_servers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: Test gegen echte Dienste (Ollama, Open-Meteo, iCloud, Notion); übersprungen, wenn nicht erreichbar"]
