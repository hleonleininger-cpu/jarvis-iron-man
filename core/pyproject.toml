[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS Core: lokaler KI-Assistent (FastAPI-Server + CLI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-ai-slim[openai]",
    "pydantic-settings",
    "structlog",
    "typer",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[project.scripts]
jarvis = "jarvis_core.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: Test gegen echtes Ollama (übersprungen, wenn nicht erreichbar)"]
