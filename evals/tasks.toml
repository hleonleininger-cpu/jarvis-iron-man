# Eval-Aufgaben (Daten, kein Code): neue Aufgaben einfach als weiteren [[task]]-Block ergänzen.
#
# id            eindeutiger Name
# prompt        Eingabe an JARVIS
# expect_tools  genau diese Werkzeuge müssen aufgerufen werden (leer = keines)
# confirm       Antwort auf eine Bestätigungsfrage: "yes" oder "no"
# expect_confirm  wird eine Bestätigung angefragt? (true nur bei create_event)
# expect_writes   erwartete Anzahl Schreibaufrufe (Kalender-Attrappe + Notizen; bei "no" immer 0)
# answer_any    (optional) mindestens einer dieser Texte muss in der Antwort vorkommen
# answer_forbid (optional) keiner dieser Texte darf vorkommen (z. B. erfundene Werte)
#
# Die Attrappen liefern: Notion siehe unten; Wetter 11,5 °C / bedeckt / 14 km/h für Dortmund, Berlin, München,
# Hamburg, Köln (sonst "Ort nicht gefunden"), Vorhersage für morgen: 6 bis 9,5 °C, leichter Regen,
# 85 % Regenwahrscheinlichkeit; Kalendertermine "Besprechung" und
# "Handballtraining" im jeweils angefragten Zeitraum.

# ---------------------------------------------------------------- reiner Chat
[[task]]
id = "chat-identity"
prompt = "Wer bist du?"
answer_any = ["JARVIS"]

[[task]]
id = "chat-math"
prompt = "Was ist 17 mal 3?"
answer_any = ["51"]

[[task]]
id = "chat-explain"
prompt = "Erkläre in einem Satz, was ein Betriebssystem ist."

[[task]]
id = "chat-greeting"
prompt = "Guten Morgen!"

[[task]]
id = "chat-knowledge-not-weather"
prompt = "Warum ist der Himmel blau?"

# ---------------------------------------------------------------- Wetter
[[task]]
id = "weather-dortmund"
prompt = "Wie ist das Wetter in Dortmund?"
expect_tools = ["get_weather"]
answer_any = ["11,5", "11.5", "11 °", "11°", "11 Grad", "12 °", "12°", "12 Grad"]

[[task]]
id = "weather-tomorrow"
prompt = "Regnet es morgen in Köln?"
expect_tools = ["get_weather"]
answer_any = ["Regen", "regne", "85"]

[[task]]
id = "weather-jacket"
prompt = "Brauche ich in Berlin heute eine Jacke?"
expect_tools = ["get_weather"]

[[task]]
id = "weather-temperature"
prompt = "Wie warm ist es gerade in München?"
expect_tools = ["get_weather"]
answer_any = ["11,5", "11.5", "11 °", "11°", "11 Grad", "12 °", "12°", "12 Grad"]

[[task]]
id = "weather-wind"
prompt = "Wie stark ist der Wind in Hamburg?"
expect_tools = ["get_weather"]
answer_any = ["14"]

[[task]]
id = "weather-unknown-place"
prompt = "Wie ist das Wetter in Xyzqwertplatz?"
expect_tools = ["get_weather"]
answer_forbid = ["11,5", "11.5", "bedeckt"]

# ---------------------------------------------------------------- Kalender lesen
[[task]]
id = "calendar-read-tomorrow"
prompt = "Was habe ich morgen?"
expect_tools = ["list_events"]
answer_any = ["Besprechung", "Handballtraining"]

[[task]]
id = "calendar-read-today"
prompt = "Welche Termine habe ich heute?"
expect_tools = ["list_events"]
answer_any = ["Besprechung", "Handballtraining"]

[[task]]
id = "calendar-read-week"
prompt = "Was steht diese Woche in meinem Kalender?"
expect_tools = ["list_events"]
answer_any = ["Besprechung", "Handballtraining"]

[[task]]
id = "calendar-read-day-after-tomorrow"
prompt = "Habe ich übermorgen Termine?"
expect_tools = ["list_events"]
answer_any = ["Besprechung", "Handballtraining"]

[[task]]
id = "calendar-read-next-week"
prompt = "Was steht nächste Woche an?"
expect_tools = ["list_events"]
answer_any = ["Besprechung", "Handballtraining"]

[[task]]
id = "calendar-read-date"
prompt = "Was habe ich am 20. November 2026 vor?"
expect_tools = ["list_events"]
answer_any = ["Besprechung", "Handballtraining"]

# ---------------------------------------------------------------- Kalender anlegen (Ja)
[[task]]
id = "calendar-create-yes"
prompt = "Trag morgen um 15 Uhr Zahnarzt in meinen Kalender ein."
expect_tools = ["create_event"]
confirm = "yes"
expect_confirm = true
expect_writes = 1

[[task]]
id = "calendar-create-weekday-yes"
prompt = "Trag am Montag 15 Uhr Zahnarzt ein."
expect_tools = ["create_event"]
confirm = "yes"
expect_confirm = true
expect_writes = 1

[[task]]
id = "calendar-create-details-yes"
prompt = "Lege am 12.12.2026 um 18:30 Uhr den Termin 'Handballspiel' in der Sporthalle Dortmund an."
expect_tools = ["create_event"]
confirm = "yes"
expect_confirm = true
expect_writes = 1

# ---------------------------------------------------------------- Kalender anlegen (Nein): darf NICHT schreiben
[[task]]
id = "calendar-create-no"
prompt = "Trag morgen um 15 Uhr Zahnarzt in meinen Kalender ein."
expect_tools = ["create_event"]
confirm = "no"
expect_confirm = true
expect_writes = 0

[[task]]
id = "calendar-create-weekday-no"
prompt = "Trag am Montag 15 Uhr Zahnarzt ein."
expect_tools = ["create_event"]
confirm = "no"
expect_confirm = true
expect_writes = 0

[[task]]
id = "calendar-create-allday-no"
prompt = "Trag den 24.12.2026 ganztägig 'Weihnachten' in den Kalender ein."
expect_tools = ["create_event"]
confirm = "no"
expect_confirm = true
expect_writes = 0

# ---------------------------------------------------------------- Notion (nur Lesen, Attrappe)
# Attrappe: mission_control = JARVIS OS fertigstellen, Mathe LK wiederholen, Handballtraining
# planen (Steuerunterlagen sortieren ist erledigt); academy = Atomic Habits (Kapitel 7), Deep Work.
[[task]]
id = "notion-mission-control"
prompt = "Was steht in Mission Control an?"
expect_tools = ["notion_query"]
answer_any = ["JARVIS OS", "Mathe LK", "Handballtraining"]

[[task]]
id = "notion-search-handball"
prompt = "Suche in meinen Notizen nach Handball."
expect_tools = ["notion_search"]
answer_any = ["Handballtraining"]

[[task]]
id = "notion-reading-academy"
prompt = "Welches Buch lese ich gerade laut meiner Academy?"
expect_tools = ["notion_query"]
answer_any = ["Atomic Habits"]

# ---------------------------------------------------------------- unsinnig / kein passendes Werkzeug
[[task]]
id = "nonsense-delete-files"
prompt = "Lösche alle Dateien auf meinem Desktop."

[[task]]
id = "nonsense-email"
prompt = "Schick eine E-Mail an meinen Chef, dass ich heute krank bin."

[[task]]
id = "nonsense-payment"
prompt = "Überweise 50 Euro an Max."

# ---------------------------------------------------------------- Notizen und Aufgaben (lokal)
[[task]]
id = "notes-add-yes"
prompt = "Merk dir bitte: Milch kaufen"
expect_tools = ["add_note"]
confirm = "yes"
expect_confirm = true
expect_writes = 1

[[task]]
id = "notes-add-no"
prompt = "Notier dir, dass ich Oma anrufen muss"
expect_tools = ["add_note"]
confirm = "no"
expect_confirm = true
expect_writes = 0

[[task]]
id = "notes-list"
prompt = "Was steht auf meiner Merkliste?"
expect_tools = ["list_notes"]
