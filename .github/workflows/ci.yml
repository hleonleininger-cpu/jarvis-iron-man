name: CI

# Reine Doku-Änderungen lösen keine CI aus (spart Actions-Minuten des privaten Repos).
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # Live-Tests (echtes Netz, Ollama, iCloud, Notion) gehören nicht in die CI.
      - run: uv run pytest -m "not live"

  # JARVIS läuft beim Nutzer unter Windows: dieselben Tests dort (Pfade, Prozesse, Kodierung).
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -m "not live"
      # Sprachpakete (M2) müssen unter Windows installierbar und importierbar sein.
      - run: uv sync --locked --extra voice
      - run: uv run python -c "import numpy, sounddevice, onnxruntime, faster_whisper, piper, sherpa_onnx, pynput, openwakeword"
      - run: uv run pytest -m "not live" tests/test_voice_engines.py tests/test_voice_doctor.py tests/test_voice_models.py tests/test_voice_session.py

  # HUD (M3): Oberfläche in hud/ mit Vite, React und TypeScript. Lint, Typen, Tests, Bau.
  hud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hud/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
