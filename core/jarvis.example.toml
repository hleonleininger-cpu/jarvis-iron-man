# Kopie als jarvis.toml ablegen (wird nicht eingecheckt). Umgebungsvariablen mit
# Präfix JARVIS_ (z. B. JARVIS_MODEL) haben Vorrang.
host = "127.0.0.1"          # 0.0.0.0 wird abgelehnt
port = 8765
ollama_base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3.5:4b"       # ohne Eintrag gilt die Empfehlung von `jarvis doctor`
data_dir = "data"
# home_location = "Dortmund"  # Wohnort: gilt, wenn eine Frage keinen Ort nennt (z. B. Wetter)
log_level = "INFO"
# Gesprächsverlauf je Sitzung (nur im Arbeitsspeicher). 0 Runden schaltet ihn ab.
history_max_turns = 10
history_max_chars = 16000
# Kontextfenster des Modells in Tokens. Ollama nutzt standardmäßig nur 4096 und kürzt längere
# Prompts still von vorn. Die Werkzeuge dieser Vorlage brauchen zusammen schon rund 3000 Tokens:
# Ollama deshalb mit OLLAMA_CONTEXT_LENGTH=8192 (für längere Gespräche 16384) starten
# (Windows: Umgebungsvariable setzen, Ollama neu starten) und hier denselben Wert eintragen.
context_tokens = 8192

# MCP-Server: nur hier deklarierte werden gestartet. `tools` ist die einzige Stelle für
# Werkzeug-Metadaten; nicht aufgeführte Werkzeuge werden dem Modell nie angeboten.
# Risikoklassen: READ, WRITE_LOCAL (nur lokale Datei, ohne Rückfrage), WRITE_REVERSIBLE,
# IRREVERSIBLE, EXTERNAL_COMMUNICATION, FINANCIAL. READ und WRITE_LOCAL laufen direkt, die
# übrigen Schreibklassen nur nach Rückfrage, FINANCIAL nie.
# command = "python" steht für den Interpreter des Cores (venv).
[mcp_servers.weather]
command = "python"
args = ["-m", "mcp_servers.weather"]

[mcp_servers.weather.tools]
get_weather = "READ"

# Websuche über DuckDuckGo (ohne Konto und Schlüssel, ADR-015). Nur der Suchbegriff geht ins
# Netz, nie der Gesprächsverlauf. Wer das nicht will, löscht diese drei Blöcke.
[mcp_servers.websearch]
command = "python"
args = ["-m", "mcp_servers.websearch"]

[mcp_servers.websearch.tools]
web_search = "READ"

# Apple-Kalender (iCloud/CalDAV). Zugangsdaten: `jarvis secrets set apple_caldav` (OS-Schlüsselbund).
# Schreibende Werkzeuge -> Policy: CONFIRM (Vorschau + Rückfrage vor dem Anlegen/Ändern/Löschen).
# `previews` nennt das Vorschau-Werkzeug (schreibt nichts, wird dem Modell nicht angeboten).
# Gelesen werden alle Kalender, neue Termine landen im ersten. Mit
# args = [..., "--kalender", "Privat"] wird nur dieser eine gelesen und beschrieben.
[mcp_servers.calendar]
command = "python"
args = ["-m", "mcp_servers.calendar"]
previews = { create_event = "preview_create_event", update_event = "preview_update_event", delete_event = "preview_delete_event" }

[mcp_servers.calendar.tools]
list_events = "READ"
create_event = "WRITE_REVERSIBLE"
# Ändern und Löschen (ADR-014): immer mit Vorschau und Rückfrage. Wer JARVIS nur lesen und
# anlegen lassen will, löscht die beiden Zeilen.
update_event = "WRITE_REVERSIBLE"
delete_event = "IRREVERSIBLE"

# Notizen und Aufgaben, lokal (SQLite, kein Netz). Standard-Datei: ~/.jarvis/notizen.sqlite3,
# andere mit args = [..., "--datei", "D:/jarvis/notizen.sqlite3"]. WRITE_LOCAL: ohne Rückfrage;
# wer vorher gefragt werden will, setzt WRITE_REVERSIBLE (die Vorschau-Werkzeuge sind da).
[mcp_servers.notes]
command = "python"
args = ["-m", "mcp_servers.notes"]
previews = { add_note = "preview_add_note", complete_note = "preview_complete_note" }
# Erinnerungen ("Erinnere mich um 18 Uhr an ..."): der Core holt fällige ab und meldet sie in der
# Web-Oberfläche bzw. im CLI-Dialog, solange JARVIS läuft (ADR-013).
reminders = "take_due_reminders"

[mcp_servers.notes.tools]
add_note = "WRITE_LOCAL"
list_notes = "READ"
complete_note = "WRITE_LOCAL"

# Ideen, Aufträge und Entwürfe für Nebeneinkünfte, lokal (ADR-016). Gespeichert in
# ~/.jarvis/projekte.sqlite3, Entwürfe als Textdateien in ~/.jarvis/entwuerfe/. Andere Orte mit
# args = [..., "--datei", "D:/jarvis/projekte.sqlite3", "--entwuerfe", "D:/jarvis/entwuerfe"].
# Nichts wird veröffentlicht, gesendet oder bezahlt; Entwürfe überschreiben nie eine Datei.
[mcp_servers.projekte]
command = "python"
args = ["-m", "mcp_servers.projekte"]

[mcp_servers.projekte.tools]
add_idea = "WRITE_LOCAL"
list_ideas = "READ"
add_lead = "WRITE_LOCAL"
list_leads = "READ"
set_project_status = "WRITE_LOCAL"
save_draft = "WRITE_LOCAL"

# Notion (NUR LESEN, JARVIS-OS-Daten). Token: `jarvis secrets set notion` (OS-Schlüsselbund).
# env ordnet Namen den Datenbank-IDs (Data-Source-IDs) zu: NOTION_DB_<NAME> = "<ID>".
# Bekannte Namen: MISSION_CONTROL, ACADEMY, FORGE, OLYMPUS, VAULT (frei erweiterbar). Die Datenbank
# muss in Notion mit der Integration geteilt sein (Seite > Verbindungen).
# Erst einschalten (Zeilen ohne "# "), wenn Token und IDs da sind: sonst startet bei jeder Anfrage
# ein Server, der nur Fehler liefert, und seine Werkzeuge belegen Platz im Kontextfenster.
# [mcp_servers.notion]
# command = "python"
# args = ["-m", "mcp_servers.notion"]
# env = { NOTION_DB_MISSION_CONTROL = "<ID>", NOTION_DB_ACADEMY = "<ID>" }
#
# [mcp_servers.notion.tools]
# notion_search = "READ"
# notion_query = "READ"
# notion_get = "READ"
