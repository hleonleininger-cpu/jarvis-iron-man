name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # Live-Tests (echtes Netz, Ollama, iCloud, Notion) gehören nicht in die CI.
      - run: uv run pytest -m "not live"

  # JARVIS läuft beim Nutzer unter Windows: dieselben Tests dort (Pfade, Prozesse, Kodierung).
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -m "not live"
