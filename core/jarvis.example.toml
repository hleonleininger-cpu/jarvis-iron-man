# Kopie als jarvis.toml ablegen (wird nicht eingecheckt). Umgebungsvariablen mit
# Präfix JARVIS_ (z. B. JARVIS_MODEL) haben Vorrang.
host = "127.0.0.1"          # 0.0.0.0 wird abgelehnt
port = 8765
ollama_base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3.5:4b"       # ohne Eintrag gilt die Empfehlung von `jarvis doctor`
data_dir = "data"
log_level = "INFO"

# MCP-Server: nur hier deklarierte werden gestartet. `tools` ist die einzige Stelle für
# Werkzeug-Metadaten; nicht aufgeführte Werkzeuge werden dem Modell nie angeboten.
# Risikoklassen: READ, WRITE_REVERSIBLE, IRREVERSIBLE, EXTERNAL_COMMUNICATION, FINANCIAL.
# command = "python" steht für den Interpreter des Cores (venv).
[mcp_servers.weather]
command = "python"
args = ["-m", "mcp_servers.weather"]

[mcp_servers.weather.tools]
get_weather = "READ"

# Apple-Kalender (iCloud/CalDAV). Zugangsdaten: `jarvis secrets set apple_caldav` (OS-Schlüsselbund).
# create_event ist WRITE_REVERSIBLE -> Policy: CONFIRM (Vorschau + Rückfrage vor dem Anlegen).
# `previews` nennt das Vorschau-Werkzeug (schreibt nichts, wird dem Modell nicht angeboten).
# Optional: einen bestimmten Kalender wählen mit args = [..., "--kalender", "Privat"].
[mcp_servers.calendar]
command = "python"
args = ["-m", "mcp_servers.calendar"]
previews = { create_event = "preview_create_event" }

[mcp_servers.calendar.tools]
list_events = "READ"
create_event = "WRITE_REVERSIBLE"
